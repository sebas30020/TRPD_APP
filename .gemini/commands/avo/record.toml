description = "Registra el veredicto de un intento (commit/reject/park) en el ledger y actualiza state.md. Uso: /avo:record commit --tag ... --hypothesis ..."
prompt = """
Cierra el intento actual usando el CLI del harness — valida el esquema del ledger y
evita una línea corrupta que rompa a todo lector futuro:

!{.avo/bin/avo record {{args}}}

Según el veredicto:

- **commit** — el intento superó `.avo/verify.sh` y mueve la métrica objetivo (o
  resuelve la tarea). Después de registrar: actualiza `.avo/state.md` con el nuevo
  estado (línea base movida, próxima acción), y haz `git add` + `git commit`
  referenciando el id del intento (p. ej. `avo(#c8e1): ...`).
- **reject** — falló la verificación o empeoró la métrica. El CLI ya añade una
  entrada base a `.avo/deadends.md` con el `--notes` que pasaste — complétala a mano
  si la causa es más matizada. Luego revierte el cambio del árbol de trabajo
  (`git restore .`) y actualiza `.avo/state.md` con la lección aprendida, no solo con
  "se descartó X".
- **park** — enfoque prometedor pero bloqueado por algo externo (dependencia,
  decisión pendiente, refactor previo necesario). Documenta en `--notes` qué lo
  desbloquea. No va a `deadends.md` — no es un callejón sin salida, queda referenciado
  en `state.md` para retomar.

No inventes el JSON del ledger a mano cuando puedes usar el CLI de arriba. No marques
`commit` si `.avo/verify.sh` no pasó — el veredicto refleja la señal anclada, no tu
impresión del cambio.
"""
